name: CI

on:
  pull_request:
  # Runs the real build/test inside a merge queue, and rebuilds main after a
  # merge so post-merge breakage is visible rather than silent (#920).
  merge_group:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  # pull_request.* is empty on push/merge_group; without the fallbacks every
  # main build would share one group and cancel the previous one.
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  # Superseding an in-flight PR run is desirable; cancelling a post-merge main
  # build is not — that is the run that tells you main is broken.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  detect-ci-changes:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    outputs:
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
      swift_changed: ${{ steps.changes.outputs.swift_changed }}
      windows_changed: ${{ steps.changes.outputs.windows_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect CI-relevant changes
        id: changes
        shell: bash
        run: |
          # Base differs by event. pull_request has base.sha; merge_group has its
          # own base_sha; push carries the previous head in `before`. Without
          # this, adding push/merge_group triggers would diff against an empty
          # ref and fail every run on main (#920).
          case "${{ github.event_name }}" in
            pull_request) base_sha="${{ github.event.pull_request.base.sha }}" ;;
            merge_group)  base_sha="${{ github.event.merge_group.base_sha }}" ;;
            *)            base_sha="${{ github.event.before }}" ;;
          esac

          # A first push, a force-push, or a squash-merge can report an
          # all-zero or unreachable `before`. Fall back to the first parent so
          # the job still produces a usable diff instead of erroring.
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=2 origin "${{ github.sha }}" || true
            base_sha="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "")"
          else
            git fetch --no-tags --depth=1 origin "$base_sha" || true
          fi

          if [[ -z "$base_sha" ]]; then
            # No comparable base (e.g. an initial commit). Treat everything as
            # changed rather than silently skipping the build.
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base_sha" "${{ github.sha }}")"
          fi
          if grep -Eq '^(docs/|site/|README\.md|QUICKSTART\.md|SECURITY\.md|CONTRIBUTING\.md)' <<< "$changed_files"; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Shared contract fixtures are asserted by the Swift fixture tests.
          if grep -Eq '(\.swift$|\.plist$|\.entitlements$|\.xcodeproj/|\.xcworkspace/|\.xcconfig$|^Resources/|^Sources/|^Tests/|^contract-fixtures/|^\.github/workflows/ci\.yml$|^Package\.swift$|^Package\.resolved$|^project\.ya?ml$)' <<< "$changed_files"; then
            echo "swift_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Shared contract fixtures are asserted by the Windows fixture tests.
          # ci.yml is included so a change to this workflow exercises the
          # Windows job itself, rather than shipping a gate nothing has run.
          if grep -Eq '(^windows/|^contract-fixtures/|^\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "windows_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_changed=false" >> "$GITHUB_OUTPUT"
          fi

  runtime-guardrails:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      # The self-hosted runners are persistent and ship no linters, so every
      # Python tool goes into a per-job virtual environment under RUNNER_TEMP
      # (wiped between jobs) rather than the runner's user site-packages.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Create a per-job virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Both linters are pinned so a release adding rules cannot turn this gate
      # red on its own; bump deliberately alongside ruff.toml and the scripts.
      # validate.sh reports NOT RUN when a tool is absent, so these two steps
      # are what make the Python and shell lints enforced.
      - name: Install ruff
        run: python3 -m pip install 'ruff==0.16.6'

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256_AARCH64: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
          SHELLCHECK_SHA256_X86_64: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            aarch64) expected="$SHELLCHECK_SHA256_AARCH64" ;;
            x86_64)  expected="$SHELLCHECK_SHA256_X86_64" ;;
            *) echo "::error::no pinned shellcheck checksum for architecture '$arch'"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          echo "${expected}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/venv/bin/shellcheck"
          shellcheck --version

      # The local-transcription unit suite needs the server's runtime deps
      # importable. parakeet-mlx is Apple-only and imported lazily, so it is
      # filtered out; every other pin comes from requirements.txt unchanged.
      - name: Install local-transcription test dependencies
        run: |
          grep -v '^parakeet-mlx' local-transcription/requirements.txt \
            | python3 -m pip install -r /dev/stdin

      # Hermetic on purpose (#962). This job blocks merges, so it must not
      # depend on live board state: a board hiccup or one mislabeled issue
      # would fail every open PR and teach reviewers to read red as noise.
      # The board audit runs in the advisory board-audit job below.
      - name: Run runtime guardrails validator
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_SKIP_BOARD_AUDIT: '1'
        run: |
          git fetch --no-tags --depth=1 origin "${{ steps.base.outputs.ref }}"
          ./scripts/validate.sh "${{ steps.base.outputs.ref }}"

  docs-site-validation:
    needs:
      - detect-ci-changes
      - runtime-guardrails
    if: needs.detect-ci-changes.outputs.docs_changed == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install docs site dependencies
        run: npm ci --prefix site

      - name: Build docs site
        run: npm run build --prefix site

  macos-build-and-test:
    needs:
      - detect-ci-changes
      - runtime-guardrails
    if: needs.detect-ci-changes.outputs.swift_changed == 'true'
    # Self-hosted Apple Silicon Macs with Xcode. The org runs no GitHub-hosted
    # jobs (the hosted-runner budget is $0 with a hard stop), and the owner
    # accepted that pull-request code runs on operator-owned hosts.
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER_LABELS) }}
    # Fail fast on a hung/contended build instead of running for hours.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select Xcode (project file requires Xcode 26)
        run: |
          # The .xcodeproj is in objectVersion 77, which only Xcode 26+
          # can read. Valid layouts on a runner:
          #   1. Side-by-side installs: /Applications/Xcode_26*.app
          #      (pick the newest)
          #   2. A single /Applications/Xcode.app, which we accept if its
          #      CFBundleShortVersionString starts with `26`.
          #   3. xcode-select already pointing at an Xcode 26 developer
          #      directory outside the app paths above.
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)

          if [[ -z "$XCODE_APP" && -d /Applications/Xcode.app ]]; then
            VERSION=$(defaults read /Applications/Xcode.app/Contents/Info CFBundleShortVersionString 2>/dev/null || echo "")
            if [[ "$VERSION" == 26* ]]; then
              XCODE_APP=/Applications/Xcode.app
              echo "Accepting /Applications/Xcode.app (version $VERSION)."
            fi
          fi

          if [[ -z "$XCODE_APP" ]]; then
            SELECTED_DEVELOPER_DIR=$(xcode-select -p 2>/dev/null || echo "")
            SELECTED_XCODE_APP="${SELECTED_DEVELOPER_DIR%/Contents/Developer}"
            if [[ -n "$SELECTED_DEVELOPER_DIR" && -d "$SELECTED_XCODE_APP/Contents" ]]; then
              VERSION=$(defaults read "$SELECTED_XCODE_APP/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "")
              if [[ "$VERSION" == 26* ]]; then
                XCODE_APP="$SELECTED_XCODE_APP"
                echo "Accepting selected Xcode at $XCODE_APP (version $VERSION)."
              fi
            fi
          fi

          if [[ -z "$XCODE_APP" ]]; then
            echo "::error::No Xcode 26.x found. Looked for /Applications/Xcode_26*.app, /Applications/Xcode.app, and the selected developer directory."
            echo "Selected developer directory: $(xcode-select -p 2>/dev/null || echo unavailable)"
            xcodebuild -version || true
            echo "Installed Xcode apps:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          echo "Selected $XCODE_APP"
          # Self-hosted runners have no passwordless sudo; DEVELOPER_DIR below
          # selects the toolchain for this job without touching the host.
          if [[ -n "$RUNNER_ENVIRONMENT" && "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug, macOS)
        run: |
          set -o pipefail
          # build-for-testing, not build: a Sources-only build never compiles the
          # test target, so test-target warnings are invisible to it. #1014 closed
          # against a change that left its warnings in place and nothing noticed
          # for weeks because no gate read a log that contained them.
          xcodebuild \
            -project BugNarrator.xcodeproj \
            -scheme BugNarrator \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build.log

      - name: Fail on Swift warnings from Sources/ or Tests/
        run: |
          # Local builds stay advisory; CI enforces. Only first-party code counts —
          # linker and appintentsmetadataprocessor noise is excluded.
          # The log must exist and be non-empty: a missing file makes grep exit 2,
          # which the `if` would otherwise read as "no warnings". Anchoring to the
          # workspace keeps a future SPM checkout's Sources/ from tripping the gate.
          test -s build.log || { echo "::error::build.log is missing or empty; the Build step did not produce a log to gate on"; exit 1; }
          if grep -E 'warning:' build.log | grep -E "^${GITHUB_WORKSPACE}/(Sources|Tests)/" | grep -v 'appintentsmetadataprocessor' > swift-warnings.txt; then
            echo "::error::Swift warnings in first-party code (the target must stay warning-free, #1076):"
            sed 's/^/  /' swift-warnings.txt
            exit 1
          fi
          echo "No Swift warnings from Sources/ or Tests/."

      - name: Run unit tests (BugNarratorTests)
        run: |
          set -o pipefail
          xcodebuild \
            -project BugNarrator.xcodeproj \
            -scheme BugNarrator \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:BugNarratorTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      # Blocking since #949. It was added non-blocking in #922 because XCUITest
      # on a hosted runner "can be flaky for reasons unrelated to the diff" —
      # but the two tests that failed did so on every run, deterministically,
      # and the leg stayed red for weeks while reading as covered. A permanently
      # red advisory check is worse than no check: it trains readers to ignore
      # red. The assertions that could not pass here were removed (see
      # BugNarratorSettingsUITests), so this now gates.
      - name: Run UI tests (BugNarratorUITests)
        run: |
          set -o pipefail
          xcodebuild \
            -project BugNarrator.xcodeproj \
            -scheme BugNarrator \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:BugNarratorUITests \
            CODE_SIGNING_ALLOWED=NO \
            test

  board-audit:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run effort-leak / board-state audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/effort-leak-audit.sh

  # The single required context. macos-build-and-test and windows-build-and-test
  # are path-gated, so requiring them directly would leave a docs-only PR waiting
  # on a check that never reports. This always runs, and fails if any upstream
  # job actually failed or was cancelled — a skipped job is a legitimate pass.
  required-checks:
    if: always()
    needs:
      - detect-ci-changes
      - runtime-guardrails
      - docs-site-validation
      - macos-build-and-test
      - windows-build-and-test
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Verify no required job failed
        env:
          RESULTS: >-
            detect-ci-changes=${{ needs.detect-ci-changes.result }}
            runtime-guardrails=${{ needs.runtime-guardrails.result }}
            docs-site-validation=${{ needs.docs-site-validation.result }}
            macos-build-and-test=${{ needs.macos-build-and-test.result }}
            windows-build-and-test=${{ needs.windows-build-and-test.result }}
        run: |
          set -euo pipefail
          echo "upstream results: $RESULTS"
          failed=0
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name reported '$result'"; failed=1 ;;
            esac
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "A required job did not pass. This gate exists so a compile-breaking PR cannot merge (#962)."
            exit 1
          fi
          echo "All required jobs passed or were legitimately skipped."

  windows-build-and-test:
    needs:
      - detect-ci-changes
    # The org has a single self-hosted Windows runner (group "Windows VM").
    # The job skips, which required-checks treats as a pass, unless both its
    # label variable is set and the repo variable BUGNARRATOR_WINDOWS_CI is
    # 'true'. That variable stays unset until the VM is provisioned with
    # Python 3.12 x64, the .NET 8 SDK and signtool: actions/setup-dotnet
    # cannot install the SDK there without elevation (run 38095353919).
    if: needs.detect-ci-changes.outputs.windows_changed == 'true' && vars.WINDOWS_RUNNER_LABELS != '' && vars.BUGNARRATOR_WINDOWS_CI == 'true'
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # build-windows.ps1 runs `dotnet build --no-restore`, so packages must be
      # restored first or the build fails on a clean runner.
      - name: Restore
        shell: pwsh
        run: dotnet restore windows/BugNarrator.Windows.sln

      - name: Build
        shell: pwsh
        run: ./windows/scripts/build-windows.ps1 -Configuration Debug

      - name: Test
        shell: pwsh
        run: ./windows/scripts/test-windows.ps1 -Configuration Debug
