name: CodeQL

on:
  workflow_dispatch:
    inputs:
      include_swift:
        description: "Run Swift analysis during this manual scan"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday at 4 AM UTC
    - cron: '0 5 1 * *'  # Monthly on the 1st at 5 AM UTC — includes Swift

permissions: {}

jobs:
  # Swift is the main product language (230 files under Sources/) but analyzing
  # it needs a hosted macOS runner, which is metered. The weekly scan stays on
  # the cheap runners; Swift rides the monthly cron and any manual dispatch that
  # asks for it. Computing the list here keeps that policy in one readable
  # place — the previous hard-coded matrix silently ignored the include_swift
  # input entirely, so Swift was never analyzed at all (#919).
  languages:
    name: Select languages
    runs-on: ubuntu-latest
    # The job runs one shell step; every recorded run finished in under a minute.
    timeout-minutes: 10
    outputs:
      list: ${{ steps.select.outputs.list }}
    steps:
      - name: Select analysis languages
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INCLUDE_SWIFT: ${{ inputs.include_swift }}
        run: |
          set -euo pipefail
          base='"actions","python","javascript-typescript","csharp"'

          include_swift=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INCLUDE_SWIFT" == "true" ]]; then
            include_swift=true
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "0 5 1 * *" ]]; then
            include_swift=true
          fi

          if [[ "$include_swift" == "true" ]]; then
            list="[$base,\"swift\"]"
          else
            list="[$base]"
          fi

          echo "Analyzing: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || matrix.language == 'csharp' && 'windows-latest' || 'ubuntu-latest' }}
    # Measured 2026-10-31 over the last 8 completed runs: actions, python and
    # javascript-typescript finish in about 1 min and csharp in at most 4 min, so
    # 15 min covers them. Swift builds the Xcode project first: its successful
    # runs took 18 and 23 min, and one failure ran for 71 min before it was
    # noticed, which is what this limit ends.
    timeout-minutes: ${{ matrix.language == 'swift' && 60 || 15 }}
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x

      - name: Build Windows solution
        if: matrix.language == 'csharp'
        shell: pwsh
        run: ./windows/scripts/build-windows.ps1 -Configuration Debug

      - name: Autobuild
        if: matrix.language != 'csharp'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
