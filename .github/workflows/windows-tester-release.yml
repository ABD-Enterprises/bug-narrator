name: Windows Tester Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example windows-tester-v0.1.0"
        required: true
        type: string
      runtime:
        description: "Windows runtime identifier"
        required: true
        default: "win-x64"
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One release at a time per tag. This workflow only runs on dispatch, so
  # the group is the tag alone: a second dispatch for the same tag waits
  # instead of building again and failing on "already exists".
  group: windows-tester-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    # The preflight validates the dispatch before a Windows runner is reserved.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Confirm the release runs from the main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          # A release must be built from the reviewed default branch, not from a
          # branch someone dispatched by hand.
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            printf '::error::Windows tester release must run from refs/heads/main, not %s.\n' "$RELEASE_REF"
            exit 1
          fi

      - name: Confirm the release environment still gates the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: windows-release
        run: bash scripts/check-release-environment.sh

      - name: Confirm the tag is in the tester release namespace
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Only this workflow's own tags may be created; an app or local server
          # release tag must never be touched from here.
          if [[ ! "$RELEASE_TAG" =~ ^windows-tester-v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            printf '::error::Release tag "%s" is not in the windows-tester-v<semver> namespace.\n' "$RELEASE_TAG"
            exit 1
          fi

      - name: Confirm signing secrets exist before reserving Windows runner
        env:
          CERT_BASE64: ${{ secrets.BUGNARRATOR_WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.BUGNARRATOR_WINDOWS_CERT_PASSWORD }}
        run: |
          missing=()
          if [[ -z "$CERT_BASE64" ]]; then
            missing+=("BUGNARRATOR_WINDOWS_CERT_BASE64")
          fi
          if [[ -z "$CERT_PASSWORD" ]]; then
            missing+=("BUGNARRATOR_WINDOWS_CERT_PASSWORD")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf '::error::Windows tester release is blocked before runner allocation. Missing repository secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

  signed-windows-tester-release:
    needs: release-preflight
    runs-on: windows-latest
    # A signed release waits for a human approval in this environment. The
    # environment's deployment branch policy admits only refs/heads/main.
    environment: windows-release
    # The only job that writes to the repository (the release and its tag).
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Confirm the release environment still gates the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: windows-release
        run: bash scripts/check-release-environment.sh

      - name: Refuse a tag that already points at another commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `gh release create` ignores --target when the tag already exists, so an
          # existing tag would publish these binaries under a tag that points at a
          # different commit. Look the tag up in the tag namespace and refuse.
          #
          # A missing tag is the normal case for a first release, and GitHub
          # reports it as "Not Found (HTTP 404)". Any other failure must not be
          # read as "no tag", so it stops the release instead.
          tag_lookup=""
          if ! tag_lookup="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha' 2>&1)"; then
            if [[ "$tag_lookup" != *'"status":"404"'* && "$tag_lookup" != *"HTTP 404"* ]]; then
              printf '::error::Could not check whether tag %s already exists: %s\n' "$RELEASE_TAG" "$tag_lookup" >&2
              exit 1
            fi
            # The tag does not exist yet, which is the normal case for a first
            # release: the release creates it.
            tag_lookup=""
          elif [[ ! "$tag_lookup" =~ ^(commit|tag)\ [0-9a-f]{40}$ ]]; then
            # A successful answer has to name an object type and a commit. An
            # empty or malformed answer is not "no tag", so it stops the
            # release rather than reading as absence.
            printf '::error::The tag lookup for %s returned an unexpected answer: %s\n' "$RELEASE_TAG" "$tag_lookup" >&2
            exit 1
          fi
          if [[ -n "$tag_lookup" ]]; then
            read -r tag_type tagged <<<"$tag_lookup"
            if [[ "$tag_type" == "tag" ]]; then
              # An annotated tag points at a tag object; peel it to the commit.
              # A failed peel is not "no tag": it stops the release instead.
              if ! tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tagged" --jq .object.sha 2>&1)"; then
                printf '::error::Could not peel the annotated tag %s: %s\n' "$RELEASE_TAG" "$tagged" >&2
                exit 1
              fi
            fi
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              printf '::error::Tag %s points at %s but this run built %s; refusing to publish it.\n' "$RELEASE_TAG" "$tagged" "$GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"

      - name: Decode signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.BUGNARRATOR_WINDOWS_CERT_BASE64 }}
        run: |
          if (-not $env:CERT_BASE64) {
            throw "Repository secret BUGNARRATOR_WINDOWS_CERT_BASE64 is required for a real signed Windows tester release."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "bugnarrator-windows-signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CERT_BASE64))
          "BUGNARRATOR_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed tester package
        shell: pwsh
        env:
          BUGNARRATOR_CERT_PASSWORD: ${{ secrets.BUGNARRATOR_WINDOWS_CERT_PASSWORD }}
          RELEASE_RUNTIME: ${{ inputs.runtime }}
        run: |
          if (-not $env:BUGNARRATOR_CERT_PASSWORD) {
            throw "Repository secret BUGNARRATOR_WINDOWS_CERT_PASSWORD is required for a real signed Windows tester release."
          }
          powershell -ExecutionPolicy Bypass -File windows/scripts/release-windows-tester.ps1 `
            -Runtime "$env:RELEASE_RUNTIME"

      - name: Upload signed package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bugnarrator-windows-signed-tester-release
          path: |
            windows/artifacts/packages/BugNarrator-windows-${{ inputs.runtime }}.zip
            windows/artifacts/validation/BugNarrator-windows-${{ inputs.runtime }}-signature.json
            windows/artifacts/validation/BugNarrator-windows-${{ inputs.runtime }}-validation.json
            windows/artifacts/validation/BugNarrator-windows-${{ inputs.runtime }}-release-notes.md
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_RUNTIME: ${{ inputs.runtime }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $args = @(
            "release", "create", "$env:RELEASE_TAG",
            "windows/artifacts/packages/BugNarrator-windows-$env:RELEASE_RUNTIME.zip",
            "windows/artifacts/validation/BugNarrator-windows-$env:RELEASE_RUNTIME-signature.json",
            "windows/artifacts/validation/BugNarrator-windows-$env:RELEASE_RUNTIME-validation.json",
            "--target", "$env:GITHUB_SHA",
            "--title", "BugNarrator Windows tester $env:RELEASE_TAG",
            "--notes-file", "windows/artifacts/validation/BugNarrator-windows-$env:RELEASE_RUNTIME-release-notes.md"
          )
          if ("$env:RELEASE_DRAFT" -eq "true") {
            $args += "--draft"
          }
          if ("$env:RELEASE_PRERELEASE" -eq "true") {
            $args += "--prerelease"
          }
          gh @args

      - name: Remove decoded signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:BUGNARRATOR_CERT_PATH -and (Test-Path $env:BUGNARRATOR_CERT_PATH)) {
            Remove-Item $env:BUGNARRATOR_CERT_PATH -Force
          }
